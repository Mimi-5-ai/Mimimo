<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الاختبار التفاعلي الشامل (الفصول 1 إلى 14) | اللغة الإنجليزية</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --card-border: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --accent: #eab308;
  --good: #10b981;
  --good-bg: rgba(16, 185, 129, 0.14);
  --bad: #ef4444;
  --bad-bg: rgba(239, 68, 68, 0.14);
  --warn: #f59e0b;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  line-height: 1.65;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
  border-bottom: 1px solid var(--card-border);
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}
.container {
  max-width: 820px;
  margin: 0 auto;
  width: 100%;
}
.top-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.brand-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: #fff;
  margin: 0;
}
.stats-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.badge {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
}
.badge.good { color: #6ee7b7; border-color: rgba(16, 185, 129, 0.4); }
.badge.bad { color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
.badge.prog { color: #fde047; border-color: rgba(234, 179, 8, 0.4); }

.controls-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
select, .ctrl-btn {
  background: #0f172a;
  color: #f8fafc;
  border: 1px solid #475569;
  padding: 8px 11px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}
select {
  flex: 1;
  min-width: 150px;
}
.ctrl-btn.mistakes-btn {
  background: #991b1b;
  border-color: #ef4444;
  color: #fff;
}
.ctrl-btn.mistakes-btn.active-mode {
  background: #eab308;
  border-color: #fef08a;
  color: #0f172a;
}
.ctrl-btn.reset-btn {
  background: #334155;
  color: #cbd5e1;
}

.progress-track {
  width: 100%;
  height: 6px;
  background: #0f172a;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 10px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #ec4899);
  width: 0%;
  transition: width 0.3s ease;
}

main {
  flex: 1;
  padding: 18px 14px 40px;
}
.quiz-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 20px 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.q-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #334155;
}
.q-tag {
  font-size: 0.78rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 8px;
  background: rgba(99, 102, 241, 0.2);
  color: #a5b4fc;
  border: 1px solid rgba(99, 102, 241, 0.35);
}
.q-number {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--muted);
}

/* Strictly LTR English Question & Options */
.q-text {
  direction: ltr;
  text-align: left;
  font-size: clamp(1.08rem, 3.5vw, 1.32rem);
  font-weight: 800;
  color: #ffffff;
  background: #0f172a;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #334155;
  margin-bottom: 16px;
  line-height: 1.55;
}
.options-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  direction: ltr;
}
.opt-btn {
  direction: ltr;
  text-align: left;
  width: 100%;
  padding: 14px 16px;
  border-radius: 13px;
  border: 2px solid #334155;
  background: #0f172a;
  color: #f1f5f9;
  font-size: 0.98rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.12);
}
.opt-btn:disabled {
  cursor: default;
}
.opt-btn.correct {
  background: var(--good-bg);
  border-color: var(--good);
  color: #6ee7b7;
}
.opt-btn.wrong {
  background: var(--bad-bg);
  border-color: var(--bad);
  color: #fca5a5;
}
.opt-btn.dimmed {
  opacity: 0.55;
}
.opt-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: #1e293b;
  color: #cbd5e1;
  font-weight: 800;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.opt-btn.correct .opt-letter {
  background: var(--good);
  color: #064e3b;
}
.opt-btn.wrong .opt-letter {
  background: var(--bad);
  color: #fff;
}

/* Arabic Feedback Box */
.feedback-box {
  display: none;
  margin-top: 18px;
  padding: 16px;
  border-radius: 14px;
  font-size: 0.94rem;
  line-height: 1.75;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
.feedback-box.good-fb {
  display: block;
  background: rgba(6, 78, 59, 0.45);
  border: 2px solid var(--good);
  color: #ecfdf5;
}
.feedback-box.bad-fb {
  display: block;
  background: rgba(127, 29, 29, 0.45);
  border: 2px solid var(--bad);
  color: #fef2f2;
}
.fb-title {
  font-weight: 900;
  font-size: 1.05rem;
  margin-bottom: 8px;
  display: block;
}
.fb-section {
  background: rgba(15, 23, 42, 0.65);
  padding: 10px 12px;
  border-radius: 10px;
  margin-top: 8px;
  border-right: 4px solid var(--accent);
}

.nav-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid #334155;
}
.nav-btn {
  padding: 12px 18px;
  border-radius: 12px;
  border: 0;
  font-family: inherit;
  font-weight: 800;
  font-size: 0.92rem;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-btn.prev {
  background: #334155;
  color: #e2e8f0;
}
.nav-btn.next {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: #fff;
  flex: 1;
  max-width: 240px;
}
.nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.empty-state {
  text-align: center;
  padding: 36px 16px;
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="top-bar">
      <h1 class="brand-title">🎯 محاكي اختبار الدكتور الشامل (Ch 1 – 14)</h1>
      <div class="stats-badges">
        <span class="badge prog" id="statProgress">1 / 120</span>
        <span class="badge good" id="statCorrect">✅ صح: 0</span>
        <span class="badge bad" id="statWrong">❌ خطأ: 0</span>
      </div>
    </div>

    <div class="controls-bar">
      <select id="filterSelect">
        <option value="all">📚 جميع الأسئلة الشاملة (120 سؤالاً)</option>
        <option value="func">🗣️ وظائف الجمل فقط (Sentence Functions)</option>
        <option value="syn">🔄 الكلمات ومعانيها وأضدادها (Synonyms & Antonyms)</option>
        <option value="gram">⚙️ القواعد والتصريفات وفخاخ الإملاء (Grammar)</option>
        <option value="read">📖 تفاصيل القطع والاستماع والأرقام (Reading & Audio)</option>
        <option value="ch1_5">🔹 الفصول (1 إلى 5)</option>
        <option value="ch6_10">🔸 الفصول (6 إلى 10)</option>
        <option value="ch11">🏆 الفصل 11 (The Best Things)</option>
        <option value="ch12">🏷️ الفصل 12 (Brand New)</option>
        <option value="ch13">👥 الفصل 13 (The Right Person)</option>
        <option value="ch14">💰 الفصل 14 (Money)</option>
      </select>

      <button class="ctrl-btn mistakes-btn" id="mistakesModeBtn" onclick="toggleMistakesMode()">
        🔁 اختبرني في أخطائي (<span id="mistakesCountBtn">0</span>)
      </button>

      <button class="ctrl-btn reset-btn" onclick="resetAllProgress()">
        🗑️ تصفير التقدم
      </button>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>
</header>

<main class="container">
  <div class="quiz-card" id="quizContainer">
    <div class="q-meta">
      <span class="q-tag" id="qCategoryTag">Chapter 1 • Grammar</span>
      <span class="q-number" id="qIndexLabel">Question 1 of 120</span>
    </div>

    <div class="q-text" id="questionText"></div>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-box" id="feedbackContainer"></div>

    <div class="nav-actions">
      <button class="nav-btn prev" id="prevBtn" onclick="navigateQuestion(-1)">➡️ السابق</button>
      <select id="jumpSelect" onchange="jumpToQuestion(this.value)" style="max-width:135px;text-align:center"></select>
      <button class="nav-btn next" id="nextBtn" onclick="navigateQuestion(1)">التالي ⬅️</button>
    </div>
  </div>
</main>

<script>
// ============================================================================
// BANK OF 120 COMPREHENSIVE QUESTIONS (100% ENGLISH QUESTIONS & OPTIONS)
// Every question includes:
// - id: unique identifier
// - ch: chapter group ('ch1_5', 'ch6_10', 'ch11', 'ch12', 'ch13', 'ch14')
// - cat: 'gram' | 'syn' | 'func' | 'read'
// - tag: English label
// - q: Strictly English question
// - opts: 4 closely similar, tricky English options
// - ans: index of correct option (0, 1, 2, or 3 - varied across questions)
// - whyRight: Arabic explanation of why the correct answer is right
// - whyWrong: Array of 4 Arabic explanations explaining why each specific wrong option is wrong
// ============================================================================
const QUESTION_BANK = [
  // ==================== CHAPTER 1 (Questions 1 - 10) ====================
  {
    id: 1, ch: "ch1_5", cat: "gram", tag: "Chapter 1 • Present Simple Trap",
    q: "He ............... the homework.",
    opts: ["write", "writes", "read", "she"],
    ans: 1,
    whyRight: "الفاعل مفرد غائب (He)، والجملة لا تحتوي على أي كلمة تدل على الماضي (مثل yesterday)، لذا فالأصل عند الدكتور هو المضارع البسيط مع إضافة حرف (-s) للفعل ليصبح (writes).",
    whyWrong: [
      "كلمة (write) فعل مجرد بدون (s)، ولا يأتي في المضارع البسيط إلا مع (I / You / We / They).",
      "",
      "كلمة (read) بدون (s) لا تصلح للمضارع مع (He)، وبما أنه لا توجد قرينة زمنية للماضي في الجملة فيُمنع اعتبارها ماضياً عند الدكتور.",
      "كلمة (she) ضمير فاعل بمعنى (هي) وليست فعلاً، والجملة تحتاج إلى فعل بعد (He)."
    ]
  },
  {
    id: 2, ch: "ch1_5", cat: "gram", tag: "Chapter 1 • Question Formation",
    q: "............ Abdullah and Khaled like eggs?",
    opts: ["Does", "Did", "Do", "Done"],
    ans: 2,
    whyRight: "الفاعل هنا شخصان مثنى/جمع (Abdullah and Khaled = They)، والسؤال عن حقيقة عامة (حب البيض) بدون أي كلمة ماضي، فنختار الفعل المساعد للمضارع مع الجمع (Do).",
    whyWrong: [
      "اخترتِ (Does) بسبب التسرع لرؤية اسم مفرد في البداية (Abdullah)، لكن الفاعل الكامل هو (Abdullah and Khaled) أي جمع!",
      "كلمة (Did) تُستخدم للماضي البسيط، والجملة تسأل عن تفضيل عام في المضارع ولا تحتوي على أي دلالة للماضي.",
      "",
      "كلمة (Done) تصريف ثالث (V3) ولا يُبدأ بها السؤال أبداً بدون فعل مساعد."
    ]
  },
  {
    id: 3, ch: "ch1_5", cat: "gram", tag: "Chapter 1 • Wh-Questions (With Trap)",
    q: "............ do you live with?",
    opts: ["Where", "Who", "When", "Which"],
    ans: 1,
    whyRight: "انتبهي لحرف الجر (with = مع) في نهاية السؤال! السؤال هنا معناه (مع مَن تعيش؟) ويسأل عن شخص عاقل (A person) فنختار (Who).",
    whyWrong: [
      "فخ خطير! نختار (Where) لو كان السؤال (Where do you live?) بدون كلمة (with)، أما وجود (with) فيحول السؤال عن الشخص العاقل (Who).",
      "",
      "كلمة (When) تسأل عن الوقت (A time) وليس عن الأشخاص.",
      "كلمة (Which) تُستخدم للاختيار بين شيئين محددين (choose between two)."
    ]
  },
  {
    id: 4, ch: "ch1_5", cat: "syn", tag: "Chapter 1 • Question Words Definitions",
    q: "Which question word is used to ask about 'the reason for doing something'?",
    opts: ["How", "Why", "What", "How long"],
    ans: 1,
    whyRight: "كلمة المفتاح في التعريف هي (reason = السبب)، ونسأل عن السبب دائماً باستخدام أداة الاستفهام (Why = لماذا).",
    whyWrong: [
      "أداة الاستفهام (How) تسأل عن الطريقة أو الكيفية (The way you do something) وليس السبب (reason).",
      "",
      "أداة الاستفهام (What) تسأل عن الشيء غير العاقل (A thing).",
      "أداة الاستفهام (How long) تسأل عن طول الفترة الزمنية (Period of time)."
    ]
  },
  {
    id: 5, ch: "ch1_5", cat: "syn", tag: "Chapter 1 • Question Words Definitions",
    q: "Which question word is used to ask about 'the way you do something'?",
    opts: ["Why", "Who", "How", "Where"],
    ans: 2,
    whyRight: "كلمة المفتاح في التعريف هي (the way = الطريقة أو الكيفية)، ونسأل عنها باستخدام (How = كيف).",
    whyWrong: [
      "أداة الاستفهام (Why) تسأل عن السبب (reason) وليس الطريقة (way).",
      "أداة الاستفهام (Who) تسأل عن الشخص العاقل (A person).",
      "",
      "أداة الاستفهام (Where) تسأل عن المكان (A place)."
    ]
  },
  {
    id: 6, ch: "ch1_5", cat: "syn", tag: "Chapter 1 • Question Words Traps",
    q: "We use '............' to ask about a period of time, and '............' to ask about the number of times.",
    opts: ["How many / How long", "How long / How many", "How far / How much", "When / Which"],
    ans: 1,
    whyRight: "عبارة (Period of time = فترة من الوقت) نسأل عنها بـ (How long)، وعبارة (number of times = عدد المرات) نسأل عنها بـ (How many).",
    whyWrong: [
      "عكستِ الترتيب! (How many) للعدد، بينما (How long) للفترة الزمنية (Period of time).",
      "",
      "أداة (How far) تسأل عن المسافة، و(How much) لغير المعدود أو السعر.",
      "أداة (When) للوقت المحدد وليست لطول المدة، و(Which) للاختيار بين شيئين."
    ]
  },
  {
    id: 7, ch: "ch1_5", cat: "gram", tag: "Chapter 1 • Verb Collocations",
    q: "I usually ............ to the gym in the morning, and ............ a football match in the evening.",
    opts: ["watch / go", "play / watch", "go / watch", "do / go"],
    ans: 2,
    whyRight: "عند وجود حرف الجر (to + مكان مثل to the gym / school / museum) نختار الفعل (go)، ومع (TV / football match) نختار الفعل (watch = يشاهد).",
    whyWrong: [
      "عكستِ الأفعال! لا يصح قول (watch to the gym).",
      "الفعل (play) لا يأخذ حرف الجر (to) مع الأماكن.",
      "",
      "الفعل (do) لا يأتي مع (to the gym)، ولا نستخدم (go) مع (a football match) بدون حرف جر."
    ]
  },
  {
    id: 8, ch: "ch1_5", cat: "read", tag: "Chapter 1 • Reading Comprehension Trap",
    q: "In Disc Golf, players don't hit a ball; instead, they throw a plastic disc towards a ............",
    opts: ["wooden goal", "metal basket", "games console", "tennis net"],
    ans: 1,
    whyRight: "في رياضة (Disc golf)، لا يضرب اللاعبون الكرة (don't hit a ball) بل يرمون قرصاً بلاستيكياً باتجاه سلة معدنية (metal basket) تمثل الحفرة (hole).",
    whyWrong: [
      "الممر أو المرمى الخشبي (wooden goal) ليس في جولف القرص.",
      "",
      "جهاز الألعاب (games console) خاص بلعبة Nintendo's Wii Sports.",
      "شبكة التنس (tennis net) لا علاقة لها بـ Disc golf."
    ]
  },
  {
    id: 9, ch: "ch1_5", cat: "read", tag: "Chapter 1 • Reading True/False Trap",
    q: "Which statement is TRUE according to the Chapter 1 reading text?",
    opts: [
      "The game of Golf is less than 200 years old.",
      "In Freestyle football, there are two big teams and players score goals.",
      "Nintendo's Wii Sports is the best-selling computer game, and Freestyle football is a mixture of juggling and football.",
      "Judges in Disc golf give points for style and tricks."
    ],
    ans: 2,
    whyRight: "لعبة (Wii Sports) هي الأكثر مبيعاً (best-selling)، وكرة القدم الحرة (Freestyle football) لا توجد فيها فرق (no teams) بل هي خليط من ألعاب الخفة وكرة القدم (mixture of juggling) ويحكم فيها الحكام (Judges).",
    whyWrong: [
      "فخ كلمة (less)! عمر لعبة الجولف أكثر من 250 سنة (more than 250 years old) وليس أقل من 200 سنة (less than 200).",
      "في (Freestyle football) لا توجد فرق (no teams) ولا يسجلون أهدافاً (don't score goals).",
      "",
      "الحكام (Judges) يعطون نقاطاً في (Freestyle football) وليس في (Disc golf)."
    ]
  },
  {
    id: 10, ch: "ch1_5", cat: "syn", tag: "Chapter 1 • Vocabulary & Antonyms",
    q: "The word 'downside' means a negative aspect, and the opposite of 'late' is '............'.",
    opts: ["large", "more", "early", "small"],
    ans: 2,
    whyRight: "كلمة (downside) تعني الجانب السلبي أو العيب، وعكس كلمة (late = متأخر) هو (early = مبكر).",
    whyWrong: [
      "كلمة (large = كبير) عكسها (small = صغير).",
      "كلمة (more = أكثر) عكسها (less = أقل).",
      "",
      "كلمة (small = صغير) هي عكس (large) وليست عكس (late)."
    ]
  },

  // ==================== CHAPTER 2 (Questions 11 - 20) ====================
  {
    id: 11, ch: "ch1_5", cat: "read", tag: "Chapter 2 • Reading Inventors Trap",
    q: "In the early 1920s, ............ made a basic television that transmitted pictures, while ............ invented the electronic television in 1929.",
    opts: [
      "Vladimir Zworykin / John Logie Baird",
      "John Logie Baird / Vladimir Zworykin",
      "Marcel Boulestin / Bridget Driscoll",
      "John Logie Baird / Marcel Boulestin"
    ],
    ans: 1,
    whyRight: "الاسكتلندي (John Logie Baird) هو من صنع التلفاز البدائي (basic television) الذي نقل الصور في أوائل العشرينات، أما المخترع الروسي (Vladimir Zworykin) فهو من اخترع التلفاز الإلكتروني عام 1929 (أبو التلفاز الحديث).",
    whyWrong: [

// ============================================================================
// STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
// ============================================================================
const STORAGE_KEY = "kfu_eng3_comprehensive_exam_v1";

let appState = {
  filter: "all",
  mistakesOnly: false,
  currentIndex: 0,
  answers: {},      // { [questionId]: selectedOptionIndex }
  mistakes: []      // array of questionIds that the user got wrong
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      appState = { ...appState, ...parsed };
    }
  } catch (e) {
    console.warn("Could not load state from localStorage", e);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {
    console.warn("Could not save state to localStorage", e);
  }
}

function getFilteredList() {
  if (appState.mistakesOnly) {
    return QUESTION_BANK.filter(q => appState.mistakes.includes(q.id));
  }
  const f = appState.filter;
  if (f === "all") return QUESTION_BANK;
  if (["func", "syn", "gram", "read"].includes(f)) {
    return QUESTION_BANK.filter(q => q.cat === f);
  }
  return QUESTION_BANK.filter(q => q.ch === f);
}

function updateTopStats() {
  let correctCount = 0;
  let wrongCount = 0;
  Object.keys(appState.answers).forEach(qId => {
    const qObj = QUESTION_BANK.find(x => x.id === Number(qId));
    if (qObj) {
      if (appState.answers[qId] === qObj.ans) correctCount++;
      else wrongCount++;
    }
  });

  const activeList = getFilteredList();
  const currentPos = activeList.length > 0 ? Math.min(appState.currentIndex + 1, activeList.length) : 0;

  document.getElementById("statProgress").textContent = `${currentPos} / ${activeList.length}`;
  document.getElementById("statCorrect").textContent = `✅ صح: ${correctCount}`;
  document.getElementById("statWrong").textContent = `❌ خطأ: ${wrongCount}`;
  document.getElementById("mistakesCountBtn").textContent = appState.mistakes.length;

  const mBtn = document.getElementById("mistakesModeBtn");
  if (appState.mistakesOnly) {
    mBtn.classList.add("active-mode");
    mBtn.innerHTML = `🔙 العودة لكل الأسئلة (الأخطاء: <span id="mistakesCountBtn">${appState.mistakes.length}</span>)`;
  } else {
    mBtn.classList.remove("active-mode");
    mBtn.innerHTML = `🔁 اختبرني في أخطائي (<span id="mistakesCountBtn">${appState.mistakes.length}</span>)`;
  }

  const pct = activeList.length > 0 ? Math.round((currentPos / activeList.length) * 100) : 0;
  document.getElementById("progressBar").style.width = `${pct}%`;
}

function renderCurrentQuestion() {
  updateTopStats();
  const list = getFilteredList();
  const container = document.getElementById("quizContainer");

  if (list.length === 0) {
    document.getElementById("qCategoryTag").textContent = "Zero Mistakes!";
    document.getElementById("qIndexLabel").textContent = "0 / 0";
    document.getElementById("questionText").innerHTML = `
      <div class="empty-state" style="direction:rtl;text-align:center">
        🎉 ممتاز جداً! لا توجد لديكِ أي أخطاء مسجلة حالياً في هذا القسم.<br>
        <button class="nav-btn next" style="margin-top:14px" onclick="toggleMistakesMode()">العودة إلى بنك الأسئلة الشامل</button>
      </div>
    `;
    document.getElementById("optionsContainer").innerHTML = "";
    document.getElementById("feedbackContainer").className = "feedback-box";
    document.getElementById("prevBtn").disabled = true;
    document.getElementById("nextBtn").disabled = true;
    document.getElementById("jumpSelect").innerHTML = "";
    return;
  }

  if (appState.currentIndex >= list.length) appState.currentIndex = list.length - 1;
  if (appState.currentIndex < 0) appState.currentIndex = 0;

  const qItem = list[appState.currentIndex];
  const userAns = appState.answers[qItem.id];
  const isAnswered = userAns !== undefined;

  document.getElementById("qCategoryTag").textContent = qItem.tag;
  document.getElementById("qIndexLabel").textContent = `Question ${appState.currentIndex + 1} of ${list.length}`;
  document.getElementById("questionText").textContent = qItem.q;

  // Populate Jump Select
  const jumpSel = document.getElementById("jumpSelect");
  jumpSel.innerHTML = list.map((item, idx) => {
    const a = appState.answers[item.id];
    const mark = a === undefined ? "•" : (a === item.ans ? "✓" : "✗");
    return `<option value="${idx}" ${idx === appState.currentIndex ? "selected" : ""}>سؤال ${idx + 1} ${mark}</option>`;
  }).join("");

  // Render Options (Strictly English LTR)
  const optsBox = document.getElementById("optionsContainer");
  optsBox.innerHTML = "";
  const letters = ["A", "B", "C", "D"];

  qItem.opts.forEach((optText, oIdx) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    if (isAnswered) {
      btn.disabled = true;
      if (oIdx === qItem.ans) {
        btn.classList.add("correct");
      } else if (oIdx === userAns && userAns !== qItem.ans) {
        btn.classList.add("wrong");
      } else {
        btn.classList.add("dimmed");
      }
    }

    btn.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px">
        <span class="opt-letter">${letters[oIdx]}</span>
        <span>${optText}</span>
      </div>
      <span>${isAnswered ? (oIdx === qItem.ans ? "✅" : (oIdx === userAns ? "❌" : "")) : ""}</span>
    `;

    btn.onclick = () => handleSelectOption(qItem, oIdx);
    optsBox.appendChild(btn);
  });

  // Render Arabic Feedback if answered
  const fbBox = document.getElementById("feedbackContainer");
  if (!isAnswered) {
    fbBox.className = "feedback-box";
    fbBox.innerHTML = "";
  } else {
    const isCorrect = userAns === qItem.ans;
    if (isCorrect) {
      fbBox.className = "feedback-box good-fb";
      fbBox.innerHTML = `
        <span class="fb-title">✅ إجابة صحيحة! أحسنتِ!</span>
        <div class="fb-section">
          <b>💡 لماذا الإجابة (<span dir="ltr">${qItem.opts[qItem.ans]}</span>) صحيحة؟</b><br>
          ${qItem.whyRight}
        </div>
      `;
    } else {
      const specificWrongReason = (qItem.whyWrong && qItem.whyWrong[userAns])
        ? qItem.whyWrong[userAns]
        : "هذا الخيار مشتت خادع لا يتوافق مع الكلمة المفتاحية أو القاعدة في الجملة.";

      fbBox.className = "feedback-box bad-fb";
      fbBox.innerHTML = `
        <span class="fb-title">❌ إجابة خاطئة! تم حفظ السؤال في سجل أخطائكِ للمراجعة.</span>
        <div class="fb-section" style="border-right-color:#ef4444">
          <b>⚠️ لماذا اختياركِ (<span dir="ltr">${qItem.opts[userAns]}</span>) خاطئ؟</b><br>
          ${specificWrongReason}
        </div>
        <div class="fb-section" style="border-right-color:#10b981">
          <b>✅ لماذا الإجابة الصحيحة هي (<span dir="ltr">${qItem.opts[qItem.ans]}</span>)؟</b><br>
          ${qItem.whyRight}
        </div>
      `;
    }
  }

  document.getElementById("prevBtn").disabled = appState.currentIndex === 0;
  document.getElementById("nextBtn").disabled = appState.currentIndex >= list.length - 1;
}

function handleSelectOption(qItem, selectedIdx) {
  appState.answers[qItem.id] = selectedIdx;
  const isCorrect = selectedIdx === qItem.ans;

  if (!isCorrect) {
    if (!appState.mistakes.includes(qItem.id)) {
      appState.mistakes.push(qItem.id);
    }
  } else {
    // If answered correctly inside "Mistakes Retest Mode", remove it from mistakes after showing feedback
    if (appState.mistakesOnly) {
      appState.mistakes = appState.mistakes.filter(id => id !== qItem.id);
    }
  }

  saveState();
  renderCurrentQuestion();
}

function navigateQuestion(step) {
  const list = getFilteredList();
  const nextIdx = appState.currentIndex + step;
  if (nextIdx >= 0 && nextIdx < list.length) {
    appState.currentIndex = nextIdx;
    saveState();
    renderCurrentQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function jumpToQuestion(idxStr) {
  appState.currentIndex = Number(idxStr);
  saveState();
  renderCurrentQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleMistakesMode() {
  appState.mistakesOnly = !appState.mistakesOnly;
  appState.currentIndex = 0;

  // When entering Mistakes Retest Mode, clear previous answers for those mistake questions so user can answer them fresh!
  if (appState.mistakesOnly) {
    appState.mistakes.forEach(mId => {
      delete appState.answers[mId];
    });
  }

  saveState();
  renderCurrentQuestion();
}

function resetAllProgress() {
  if (confirm("هل أنتِ متأكدة من تصفير جميع إجاباتكِ وسجل الأخطاء والبدء من جديد؟")) {
    appState.answers = {};
    appState.mistakes = [];
    appState.currentIndex = 0;
    appState.mistakesOnly = false;
    saveState();
    renderCurrentQuestion();
  }
}

document.getElementById("filterSelect").onchange = (e) => {
  appState.filter = e.target.value;
  appState.mistakesOnly = false;
  appState.currentIndex = 0;
  saveState();
  renderCurrentQuestion();
};

// Initialize
loadState();
document.getElementById("filterSelect").value = appState.filter || "all";
renderCurrentQuestion();
</script>
</body>
</html>
