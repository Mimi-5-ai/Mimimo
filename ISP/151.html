<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بنك الأسئلة الشامل (151 سؤالاً) | أمن البيانات والخصوصية</title>
<style>
:root {
  --bg: #f2f7f6;
  --card: #ffffff;
  --border: #d5e6e4;
  --ink: #132a28;
  --muted: #5c7471;
  --primary: #0d9488;
  --primary-dark: #115e59;
  --primary-soft: #ccfbf1;
  --good: #059669;
  --good-bg: #ecfdf5;
  --bad: #dc2626;
  --bad-bg: #fef2f2;
  --shadow: 0 16px 42px rgba(19, 42, 40, 0.08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: var(--bg); }
body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% -18rem, rgba(13, 148, 136, 0.11), transparent 38rem),
    var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
button, select { font: inherit; }
button:focus-visible, select:focus-visible {
  outline: 3px solid rgba(13, 148, 136, 0.35);
  outline-offset: 3px;
}
header {
  position: sticky;
  top: 0;
  z-index: 50;
  overflow: hidden;
  background: linear-gradient(135deg, #042f2e 0%, #0d9488 100%);
  color: #fff;
  padding: 18px 20px 14px;
  box-shadow: 0 10px 28px rgba(4, 47, 46, 0.18);
}
.container { max-width: 940px; margin: 0 auto; width: 100%; }
.top-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px 20px;
}
.title { font-size: clamp(1.05rem, 2.5vw, 1.35rem); font-weight: 800; margin: 0; line-height: 1.5; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  font-size: 0.82rem;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 99px;
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.18);
  white-space: nowrap;
}
.badge.good { background: rgba(10, 91, 63, 0.82); color: #e2fff2; }
.badge.bad { background: rgba(124, 36, 36, 0.78); color: #ffe8e8; }
.badge.prog { background: #fff; color: var(--primary-dark); border-color: #fff; direction: ltr; unicode-bidi: isolate; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}
select, .btn-ctrl {
  min-height: 42px;
  padding: 9px 13px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,0.48);
  background: #fff;
  color: #34313a;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
select { flex: 1; min-width: min(240px, 100%); }
.btn-ctrl:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(19, 42, 40, 0.13); }
.btn-ctrl.mode { background: #fff; color: var(--primary-dark); }
.btn-ctrl.mistakes { background: #fff; color: var(--primary-dark); }
.btn-ctrl.mistakes.active { background: var(--primary-soft); color: var(--primary-dark); border-color: var(--primary); }
.btn-ctrl.reset { background: rgba(4, 47, 46, 0.42); color: #fff; border-color: rgba(255,255,255,0.32); }

.progress-bar {
  width: 100%;
  height: 5px;
  background: rgba(255,255,255,0.28);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 15px;
}
.progress-fill {
  height: 100%;
  background: #99f6e4;
  width: 0%;
  transition: width .3s ease;
}

main { flex: 1; padding: 30px 16px 56px; }
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: clamp(18px, 3.5vw, 30px);
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.q-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.q-tag {
  background: var(--primary-soft);
  color: var(--primary-dark);
  font-size: 0.82rem;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 99px;
}
.q-num { font-size: 0.86rem; font-weight: 700; color: var(--muted); }
.q-text {
  font-size: clamp(1.02rem, 2.5vw, 1.18rem);
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 20px;
  background: #f4fbf9;
  padding: 16px 18px;
  border-radius: 13px;
  border-right: 4px solid var(--primary);
}
.opts-list { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  width: 100%;
  text-align: right;
  padding: 13px 15px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--ink);
  font-family: inherit;
  font-size: 0.96rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  transition: border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--primary);
  background: #f0fdfa;
  box-shadow: 0 4px 12px rgba(13, 148, 136, 0.08);
  transform: translateY(-1px);
}
.opt-btn:disabled { cursor: default; }
.opt-btn.correct {
  background: var(--good-bg);
  border-color: var(--good);
  color: #126545;
}
.opt-btn.wrong {
  background: var(--bad-bg);
  border-color: var(--bad);
  color: #991b1b;
}
.opt-btn.dimmed { opacity: 0.55; }
.opt-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--primary-soft);
  color: var(--primary-dark);
  font-size: 0.82rem;
  flex-shrink: 0;
}
.opt-btn.correct .opt-letter { background: var(--good); color: #fff; }
.opt-btn.wrong .opt-letter { background: var(--bad); color: #fff; }

.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.nav-btn {
  min-height: 44px;
  padding: 11px 18px;
  border-radius: 12px;
  border: 0;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  transition: background .18s ease, transform .18s ease;
}
.nav-btn.prev { background: #e6f4f1; color: var(--primary-dark); }
.nav-btn.prev:hover:not(:disabled) { background: #ccfbf1; }
.nav-btn.next { background: var(--primary); color: #fff; flex: 1; max-width: 220px; }
.nav-btn.next:hover:not(:disabled) { background: var(--primary-dark); }
.nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.nav-bar select { flex: 0 1 150px; min-width: 110px; border-color: var(--border); }

@media (max-width: 600px) {
  header { padding: 14px 14px 12px; }
  .top-row { align-items: flex-start; }
  .badges { width: 100%; }
  .controls { gap: 8px; }
  .controls select { flex-basis: 100%; }
  .btn-ctrl { flex: 1 1 auto; padding-inline: 10px; }
  main { padding: 20px 12px 40px; }
  .q-card { border-radius: 16px; }
  .nav-bar { flex-wrap: wrap; }
  .nav-bar .prev, .nav-bar .next { flex: 1 1 38%; }
  .nav-bar select { order: 3; flex-basis: 100%; max-width: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style>
</head>

  [27,"ch1","الفصل 1 - الوحدة 1","(2) ما هو تعريف سرية المعلومات في سياق أمن المعلومات:",["التأكد من صحة المعلومات المخزنة.","حماية المعلومات من الوصول غير المصرح به.","الحفاظ على تكامل المعلومات.","حماية المعلومات من الفقدان."],1],
  [28,"ch1","الفصل 1 - الوحدة 1","(3) ما هو التعريف الصحيح للتكاملية وسلامة المحتوى (INTEGRITY) في سياق أمن المعلومات:",["ضمان سرية المعلومات وعدم الوصول غير المصرح به."," الحفاظ على توفر المعلومات للأشخاص المخولين بها.","ضمان صحة المعلومات وعدم التلاعب بها.","السرية والتكاملية فقط."],2],
  [29,"ch1","الفصل 1 - الوحدة 2","(1) يعتبر نظام بصمة الوجه في أمن المعلومات:",["شيء في جسدك.","شيء نعرفه.","شيء نملكه.","شيء لا نملكه."],0],
  [30,"ch1","الفصل 1 - الوحدة 2","(2) نظام التوثيق الذي يستخدم قراءة البصمات لتأكيد هوية المستخدم:",["نظام التحقق الثنائي.","نظام التشفير المتقدم.","نظام التوثيق الثلاثي العوامل.","نظام إدارة الهوية والوصول."],3],
  [31,"ch1","الفصل 1 - الوحدة 2","(3) أحد التحديات الرئيسية لاستخدام كلمات السر في أمن المعلومات:",["تعقيد إنشاء كلمات سر قوية.","نسيان كلمات السر من قبل المستخدمين.","ضعف أداء الأجهزة القارئة للبصمات.","تعرض كلمات السر للاختراق في الشبكة."],1],
  [32,"ch1","الفصل 1 - الوحدة 3","(1) أحد أفضل التدابير لتعزيز أمان شبكتك المنزلية هو:",["ترك كلمة مرور المشرف الافتراضية كما هي.","تعطيل التشفير على الشبكة.","تغيير كلمة مرور المشرف.","تشارك اسم الشبكة مع الجيران."],2],
  [33,"ch1","الفصل 1 - الوحدة 3","(2) أحد أفضل التدابير لتعزيز الأمان عند استخدام الهاتف المحمول:",["عدم وضع كلمة مرور على الجهاز.","تحميل البرامج من خارج المتجر.","عدم أخذ نسخ احتياطية للجهاز.","وضع PIN على شريحة المزود بالخدمة."],3],
  [34,"ch1","الفصل 1 - الوحدة 3","(3) الخيار الأمثل لاستخدام كلمة مرور قوية غير مرتبطة بمعلومات شخصية هو:",["تركيبة عشوائية من الأحرف الكبيرة والصغيرة والأرقام والرموز.","اسم الشركة التي تعمل فيها.","تسلسل أرقام سهلة مثل '123456'.","تاريخ ميلادك."],0],

  // ==================== الفصل الثاني (35 - 43) ====================
  [35,"ch2","الفصل 2 - الوحدة 1","(1) التهديد الأساسي الذي يستهدف الأمن السيبراني هو:",["البرامج الضارة.","الاختراقات الهجينة.","هجمات الحرمان من الخدمة (DDoS).","التصيد الاحتيالي (Phishing)."],0],
  [36,"ch2","الفصل 2 - الوحدة 1","(2) الهدف الرئيسي للأمن السيبراني هو:",["حماية البيانات الشخصية للمستخدمين.","الحفاظ على سلامة الأنظمة والشبكات الإلكترونية.","تطوير تقنيات الهجوم السيبراني.","تعزيز الحوكمة الإلكترونية للمؤسسات."],1],
  [37,"ch2","الفصل 2 - الوحدة 1","(3) الذي يشمله الأمن السيبراني بشكل خاص هو:",["حماية الأجهزة الإلكترونية فقط.","حماية الشبكات الإلكترونية فقط.","حماية البيانات والمعلومات الحساسة فقط.","حماية الأجهزة الإلكترونية والشبكات والمعلومات الحساسة."],3],
  [38,"ch2","الفصل 2 - الوحدة 2","(1) ما العلاقة بين الأمن السيبراني والاضطرابات السلوكية؟",["لا توجد علاقة بينهما.","يمكن أن يؤثر الأمن السيبراني على السلوك الإلكتروني للأفراد.","يمكن أن تؤدي الاضطرابات السلوكية إلى زيادة التهديدات السيبرانية.","يمكن أن تتسبب الاضطرابات السلوكية في تعطيل أنظمة الأمن السيبراني."],2],
  [39,"ch2","الفصل 2 - الوحدة 2","(2) كيف يمكن أن يؤثر الأمن السيبراني على الاضطرابات السلوكية؟",["يمكن أن تؤدي الانتهاكات السيبرانية إلى زيادة الاضطرابات السلوكية.","يمكن أن يحدث انخفاض في حالة السلوك السليم نتيجة للهجمات السيبرانية.","يمكن أن يتسبب القلق الناجم عن الأمان السيبراني في ظهور اضطرابات سلوكية.","يمكن أن تؤدي انتهاكات الأمن السيبراني إلى تعرض الأفراد للاضطرابات السلوكية."],3],
  [40,"ch2","الفصل 2 - الوحدة 2","(3) كيف يمكن تعزيز الأمن السيبراني للحد من الاضطرابات السلوكية؟",["بتحسين الوعي الأمني للأفراد وتعزيز ممارسات الأمان السيبراني.","بزيادة عدد الاختبارات النفسية للكشف عن الاضطرابات السلوكية.","بتنفيذ سياسات صارمة لعقوبة المرتكبين للحد من الاضطرابات السلوكية.","بتطوير تقنيات متقدمة للكشف عن الاضطرابات السلوكية عبر الإنترنت."],0],
  [41,"ch2","الفصل 2 - الوحدة 3","(1) أحد أفضل التدابير لتعزيز أمان الجهاز الشخصي هو:",["تحميل البرامج من مصادر غير موثوقة.","تشغيل الجهاز بوضع الوضع الجذري.","تحديث نظام التشغيل والبرامج بانتظام.","استخدام كلمة مرور قصيرة وسهلة التخمين."],2],
  [42,"ch2","الفصل 2 - الوحدة 3","(2) ما هو أحد أكثر الأخطاء الأمنية شيوعاً التي يقع فيها المستخدمون عند استخدام الجهاز الشخصي:",["فتح رسائل البريد الإلكتروني من مصادر غير معروفة.","تشارك كلمات المرور مع الآخرين.","تحميل الملفات المرفقة من الويب دون فحصه.","تشغيل الجهاز بوضع الوضع الجذري."],1],
  [43,"ch2","الفصل 2 - الوحدة 3","(3) أحد أفضل الأساليب لحماية البيانات الحساسة على الجهاز الشخصي هو:",["تخزين جميع البيانات على قرص صلب خارجي.","تعطيل جميع خدمات الإنترنت على الجهاز.","نشر البيانات الحساسة على وسائل التواصل الاجتماعي.","استخدام برامج مكافحة الفيروسات والبرمجيات الخبيثة."],3],

  // ==================== الفصل الثالث (44 - 52) ====================
  [44,"ch3","الفصل 3 - الوحدة 1","(1) هي البرمجيات التي تعمل على نقل المعلومات من الأجهزة المصابة دون علم مالكيها بهدف التجسس:",["برامج الفيروسات.","برامج التجسس (Spyware).","برامج الاحتيال الإلكتروني (Phishing).","برامج الاختراق (Malware)."],1],
  [45,"ch3","الفصل 3 - الوحدة 1","(2) ما هي الأنواع الشائعة للبرمجيات الضارة؟",["الديدان الإلكترونية (Worms).","أحصنة طروادة (Trojans).","الفيروسات (Viruses).","برامج الاحتيال الإلكتروني (Phishing)."],2],
  [46,"ch3","الفصل 3 - الوحدة 1","(3) الآثار التي تسببها برامج الرقصة الإلكترونية (The Morris Worm) هي:",["تعطيل الشبكات والأنظمة المصابة.","تشفير الملفات على الأجهزة المصابة.","سرقة المعلومات الحساسة من الأجهزة المصابة.","انتشار سريع إلى أجهزة أخرى عبر الشبكة."],0],
  [47,"ch3","الفصل 3 - الوحدة 2","(1) الفيروس الأخطر الذي يتعامل معه البوت نت (Botnet) هو:",["فيروس تروجان (Trojan Virus)","فيروس الديدان (Worm virus)","فيروس الاختراق (Ransomware Virus)","فيروس التجسس (Spyware Virus)"],2],
  [48,"ch3","الفصل 3 - الوحدة 2","(2) يمكن للبوت نت (Botnet) استغلال قدرات المعالجة والشبكة للأجهزة المصابة في أنشطة غير قانونية أخرى مثل:",["تنفيذ هجمات تعدين العملات الرقمية (الكريبتوكيرنسي) دون علم المستخدم.","تشغيل برامج القرصنة والاحتيال عبر الإنترنت.","استخدام قدرات الحوسبة العالية لتنفيذ هجمات تخريبية على الأنظمة الحسابية الحكومية.","نشر برامج التجسس وسرقة المعلومات التجارية السرية."],2],
  [49,"ch3","الفصل 3 - الوحدة 2","(3) ما هو اسم العملية التي يستخدمها البرنامج الضار لنقل الفيروسات من جهاز حاسوب إلى آخر؟",["النقل الفوري.","الاختراق المباشر.","التبادل المشفر.","ناقل الفيروس."],3],
  [50,"ch3","الفصل 3 - الوحدة 3","(1) ما هي وظيفة قنبلة المنطق Logic Bomb؟",["تعطيل أو تلف النظام المستهدف.","تسريب المعلومات الحساسة من النظام.","الانتشار إلى أجهزة أخرى عبر الشبكة.","تشفير الملفات على النظام المستهدف."],0],
  [51,"ch3","الفصل 3 - الوحدة 3","(2) ما هي الطرق التي تستخدمها الديدان (Worms) للانتشار والتكاثر:",["الوصول المباشر إلى الأجهزة المتصلة بالشبكة.","استغلال ثغرات في أنظمة التشغيل والبرامج.","إرسال رسائل بريد إلكتروني مشبوهة.","استخدام الوسائط المحمولة مثل الأقراص الصلبة."],1],
  [52,"ch3","الفصل 3 - الوحدة 3","(3) كيف تعمل الديدان Worms على تكاثر نفسها؟",["عن طريق إرسال رسائل بريد إلكتروني مشبوهة.","عن طريق تنزيل الملفات من مواقع غير موثوقة.","عن طريق البحث عن ثغرات في أنظمة التشغيل والبرامج المثبتة.","عن طريق الوصول المباشر إلى الأجهزة المتصلة بالشبكة."],2],

  // ==================== الفصل الرابع (53 - 61) ====================
  [53,"ch4","الفصل 4 - الوحدة 1","(1) الهدف الرئيسي لفيروس الباب الخلفي Backdoor Virus هو:",["سرقة المعلومات الشخصية.","تشفير الملفات على الجهاز المستهدف.","الوصول غير المشروع إلى النظام والتحكم فيه.","أعطال في أداء الجهاز."],2],
  [54,"ch4","الفصل 4 - الوحدة 1","(2) الفكرة الأساسية وراء فيروس حصان طروادة هي:",["التلاعب والتمويه لإقناع المستخدمين بتنزيلها أو تشغيلها.","استخدام الحكاية الأسطورية لحصار مدينة طروادة.","تدمير البيانات والملفات على النظام.","السماح بوصول غير مصرح به إلى النظام."],0],
  [55,"ch4","الفصل 4 - الوحدة 1","(3) ما هو تعريف حصان طروادة في سياق أمن المعلومات؟",["برنامج يقوم بتشفير الملفات على جهاز الكمبيوتر.","برنامج ضار يتظاهر بأنه برنامج آمن أو مفيد.","برنامج يستخدم في نظام التشغيل لتعزيز الأمان.","برنامج يتحكم في أداء الشبكة وتوجيه حركة المرور."],1],
  [56,"ch4","الفصل 4 - الوحدة 2","(1) طريقة عمل برامج الفدية Encrypting Ransomware هي:",["تقوم بقفل واجهة الجهاز المستهدف.","تعرض رسائل تحذيرية وإعلانات مزعجة.","تشفر الملفات على الجهاز المستهدف.","تستهدف أجهزة الهواتف المحمولة والأجهزة اللوحية."],2],
  [57,"ch4","الفصل 4 - الوحدة 2","(2) الذي يطلبه المهاجمون في برامج الفدية Locker Ransomware هو:",["دفع فدية مالية لفك تشفير الملفات.","إعادة فتح واجهة الجهاز واستعادة الوصول إليه.","تحميل برامج أمان مزيفة.","تحديث نظام التشغيل المزيف."],1],
  [58,"ch4","الفصل 4 - الوحدة 2","(3) الخاصية الرئيسية لبرامج الفدية Scareware هي:",["تشفير الملفات على الجهاز المستهدف.","قفل واجهة الجهاز المستهدف.","استهداف أجهزة الهواتف المحمولة والأجهزة اللوحية.","عرض إعلانات مزعجة ورسائل تحذيرية."],3],
  [59,"ch4","الفصل 4 - الوحدة 3","(1) وظيفة برنامج التجسس Adware هي:",["عرض إعلانات مزعجة وغير مرغوب فيها على المتصفحات.","تسجيل الضغط على لوحة المفاتيح والأنشطة على الكمبيوتر.","سرقة المعلومات الشخصية والحساسة.","تعطيل البرامج الأخرى وتشويش عمل النظام."],0],
  [60,"ch4","الفصل 4 - الوحدة 3","(2) طريقة شائعة يتم من خلالها انتقال برامج التجسس إلى الأجهزة المحمولة (مثل الأجهزة اللوحية) هي:",["زيارة مواقع الإنترنت المشبوهة وتنزيل الملفات.","تحميل التطبيقات من متاجر غير رسمية غير Google Play أو App Store.","استخدام شبكات Wi-Fi العامة غير الآمنة.","فتح رسائل البريد الإلكتروني المشبوهة والمرفقات."],1],
  [61,"ch4","الفصل 4 - الوحدة 3","(3) الهدف الرئيسي لاستخدام Keyloggers في برامج التجسس هو:",["سرقة الملفات الشخصية والصور.","تعطيل البرامج الأخرى وتشويش عمل النظام.","الوصول إلى المعلومات الحساسة مثل كلمات المرور ومعلومات الحسابات المصرفية.","تتبع نشاط المستخدم على الإنترنت."],2],

  // ==================== الفصل الخامس (62 - 70) ====================
  [62,"ch5","الفصل 5 - الوحدة 1","(1) تعرّف الهندسة الاجتماعية على أنها:",["استخدام أساليب للتأثير على الضحية والحصول على معلومات سرية.","استخدام تقنيات الهكر لاختراق الأنظمة الحاسوبية.","تشفير البيانات والمعلومات الحساسة للحفاظ على الأمان.","الاحتيال على الأشخاص عبر الهواتف النقالة."],0],
  [63,"ch5","الفصل 5 - الوحدة 1","(2) الهندسة الاجتماعية التي تشمل استخدام البريد الإلكتروني الاحتيالي هي:",["الهندسة الاجتماعية الهاتفية.","الهندسة الاجتماعية المباشرة.","الهندسة الاجتماعية عبر الإنترنت.","الهندسة الاجتماعية الاستراتيجية."],2],
  [64,"ch5","الفصل 5 - الوحدة 1","(3) التقنية التي يستخدمها المهاجمون لاستغلال الثغرات في الأنظمة الأمنية للوصول إلى المعلومات الحساسة هي:",["الاختراق الاجتماعي.","البرمجة الضارة.","الاختراق الإلكتروني.","التجسس الإلكتروني."],0],
  [65,"ch5","الفصل 5 - الوحدة 2","(1) ماذا يعني مصطلح التصيد الإلكتروني؟",["تقنية للحصول على معلومات شخصية عبر الإنترنت.","إجراءات للدفاع عن الأنظمة الإلكترونية من الهجمات.","استخدام البريد الإلكتروني للقيام بعمليات احتيالية.","استخدام برنامج حماية من الفيروسات وجدار ناري."],0],
  [66,"ch5","الفصل 5 - الوحدة 2","(2) الهدف الرئيسي للمهاجمين في عمليات التصيد الإلكتروني هو:",["تجريب ثغرات الأمان في الأنظمة الإلكترونية.","سرقة المعلومات الشخصية والمالية للأفراد.","تشويش الاتصالات الإلكترونية لدى المؤسسات.","استخدام الشبكات الآمنة دائماً."],1],
  [67,"ch5","الفصل 5 - الوحدة 2","(3) أحد أساليب التصيد الإلكتروني الشائعة هي:",["الهجمات الموجهة على الشبكة (DDoS).","الاختراق القوي (Brute-force attack).","البريد الإلكتروني الاحتيالي (Phishing).","البرمجيات الخبيثة."],2],
  [68,"ch5","الفصل 5 - الوحدة 3","(1) هجمات ثقب الري (Watering Hole) هي:",["هجمات تستهدف مواقع إلكترونية مشهورة لسرقة بيانات المستخدمين.","هجمات تستهدف مواقع إلكترونية تعتاد زيارتها مجموعة معينة من الأشخاص.","هجمات تستهدف الشبكات الاجتماعية للحصول على معلومات شخصية.","هجمات تستخدم برامج ضارة لاختراق أجهزة الكمبيوتر."],1],
  [69,"ch5","الفصل 5 - الوحدة 3","(2) الاصطياد عبر USB هو:",["استخدام أجهزة USB لنقل البيانات بين الأجهزة.","استخدام أجهزة USB لاسترجاع الملفات المحذوفة.","استخدام أجهزة USB لتشفير البيانات وضمان الأمان.","استخدام أجهزة USB لتثبيت برامج ضارة على أجهزة الكمبيوتر."],3],
  [70,"ch5","الفصل 5 - الوحدة 3","(3) ما هي طريقة التعرف على هجمات اختراق البريد الإلكتروني للعمل؟",["استخدام البرامج المضادة للاختراق والتحليل الضوئي للرسائل الإلكترونية.","التحقق من هوية المرسل ومصداقية الرسائل الواردة.","تدريب الموظفين على التعرف على رسائل البريد الإلكتروني الاحتيالية والتلاعب بها.","تنفيذ نظام مراقبة واستدلال قوي لرصد وتحليل هجمات اختراق البريد الإلكتروني."],1],

  // ==================== الفصل السادس (71 - 79) ====================
  [71,"ch6","الفصل 6 - الوحدة 1","(1) الهجمات الموجهة Targeted Attacks هي:",["هجمات تستهدف أي كيان عشوائي بدون تحديد.","هجمات تستهدف كياناً أو منظمة محددة بعناية.","هجمات تستهدف الشبكات الاجتماعية والوسائط الاجتماعية فقط.","هجمات تستهدف الأجهزة الذكية فقط."],1],
  [72,"ch6","الفصل 6 - الوحدة 1","(2) تعرف التهديدات الداخلية Insider Threats بـ:",["هجمات تستهدف الأفراد الذين لديهم وصول غير مصرح به إلى الشبكات الداخلية.","هجمات تنفذها مجموعات خارجية للمنظمة فقط.","هجمات تستهدف الأفراد العاملين في المنظمة فقط.","هجمات تستهدف الأفراد العاملين في المنظمة والشركاء السابقين والحاليين."],3],
  [73,"ch6","الفصل 6 - الوحدة 1","(3) تعريف الهجمات المتقدمة المستمرة Advanced Persistent Threats - APTs هو:",["هجمات تستمر لفترات طويلة من الزمن وتستهدف كياناً أو منظمة محددة بعناية.","هجمات تستمر لفترات قصيرة من الزمن وتستهدف عدة منظمات في نفس الوقت.","هجمات تستهدف الأفراد فقط بدون استهداف المنظمات.","هجمات تستهدف الأجهزة الذكية فقط."],0],
  [74,"ch6","الفصل 6 - الوحدة 2","(1) الهجمات عبر سلسلة التوريد Supply Chain Attacks هي:",["هجمات تستهدف الأجهزة الشخصية للمستخدمين.","هجمات تستهدف الشبكات الاجتماعية.","هجمات تستهدف الموردين والشركات في سلسلة التوريد.","هجمات تستهدف الأجهزة الحكومية."],2],
  [75,"ch6","الفصل 6 - الوحدة 2","(2) أحد أمثلة هجمات عبر سلسلة التوريد الشهيرة التي وقعت في السنوات الأخيرة هو:",["هجوم (WannaCry)","هجوم (Heartbleed)","هجوم (Solarwinds)","هجوم (NotPetya)"],2],
  [76,"ch6","الفصل 6 - الوحدة 2","(3) الهدف الرئيسي للهجمات عبر سلسلة التوريد هو:",["سرقة البيانات الشخصية للمستخدمين.","تعطيل الشبكات والأنظمة الحاسوبية.","التجسس على الأنشطة الحكومية.","التسلل إلى الشبكات والأنظمة عبر الثغرات في سلسلة التوريد."],3],
  [77,"ch6","الفصل 6 - الوحدة 3","(1) ماذا تعني هجمات الرفض من الخدمة الموزعة (DDoS):",["هجوم يستهدف تعطيل خادم الويب ومنع الوصول إليه من قبل المستخدمين الشرعيين.","طريقة لاختراق الأجهزة وسرقة البيانات الحساسة.","استغلال ثغرات البرمجيات للوصول إلى خادم الويب.","تقنية تستخدم لتحسين أداء الشبكات الموزعة."],0],
  [78,"ch6","الفصل 6 - الوحدة 3","(2) أحد أهداف هجمات الرفض من الخدمة الموزعة DDoS هي:",["سرقة المعلومات الحساسة.","تعطيل خدمة الويب وإبقاء المستخدمين بعيدين عنها.","الوصول غير المصرح به إلى الأجهزة المستهدفة.","تسريب البرمجيات الخبيثة في الشبكة."],1],

  [81,"ch7","الفصل 7 - الوحدة 1","(2) وحدة القياس المستخدمة لقوة التشفير هي:",["بت (Bit)","بايت (Byte)","كيلوبايت (Kilobyte)","ميجابايت (Megabyte)"],0],
  [82,"ch7","الفصل 7 - الوحدة 1","(3) نوع التشفير الذي يستخدم مفتاحاً واحداً لكلاً من عملية التشفير وفك التشفير هو:",["التشفير الغير متماثل (Asymmetric Encryption)","التشفير المتماثل والغير متماثل معاً.","التشفير المتماثل (Symmetric Encryption)","التشفير المتماثل والغير متماثل في نفس الوقت."],2],
  [83,"ch7","الفصل 7 - الوحدة 2","(1) نوع التشفير الذي يستخدم مفتاحاً واحداً لكلا من عملية التشفير وفك التشفير هو:",["التشفير المتماثل (Symmetric Encryption)","التشفير غير المتماثل (Asymmetric Encryption)","التشفير المتماثل وغير المتماثل معاً (Hybrid Encryption)","التشفير التقاربي المتزامن (Synchronous Stream Cipher Encryption)"],0],
  [84,"ch7","الفصل 7 - الوحدة 2","(2) نوع التشفير الذي يستخدم مفتاحين مختلفين لعملية التشفير وفك التشفير هو:",["التشفير المتماثل (Symmetric Encryption)","التشفير غير المتماثل (Asymmetric Encryption)","التشفير المتماثل وغير المتماثل معاً (Hybrid Encryption)","التشفير التقاربي المتزامن (Synchronous Stream Cipher Encryption)"],1],

  [89,"ch8","الفصل 8 - الوحدة 1","(1) نظام الكشف عن التسلل هو:",["نظام يحمي الشبكات اللاسلكية من الهجمات السلكية.","نظام يراقب ويكشف عن محاولات غير مصرح بها لاختراق الشبكة.","نظام يشفر الاتصالات في الشبكات اللاسلكية.","نظام يوفر أماناً إضافياً للأجهزة المتصلة بالشبكة اللاسلكية."],1],
  [90,"ch8","الفصل 8 - الوحدة 1","(2) الطريقة الأولية التي يستخدمها نظام الكشف عن التسلل للكشف عن الهجمات هي:",["تحليل سلوك المستخدمين.","فحص حركة البيانات على الشبكة.","الكشف عن ثغرات البرمجيات.","رصد حركة المرور وتحليل الأنماط."],3],
  [91,"ch8","الفصل 8 - الوحدة 1","(3) الخطوة التالية بعد اكتشاف هجوم بواسطة نظام الكشف عن التسلل هي:",["تنبيه المشرف للشبكة.","قطع الاتصال اللاسلكي على الفور.","تحليل تفاصيل الهجوم وتصنيفه.","إعادة تشغيل الأجهزة المتصلة بالشبكة."],0],
  [92,"ch8","الفصل 8 - الوحدة 2","(1) التعريف الصحيح لنظام الكشف المبني على المضيف Host-Based IDS هو:",["نظام يكشف عن التهديدات الخارجية فقط.","نظام يكشف عن الهجمات على الشبكة فقط.","نظام يكشف عن الهجمات والتهديدات على المضيفات الفردية.","نظام يكشف عن الهجمات على الأجهزة الشخصية فقط."],2],
  [93,"ch8","الفصل 8 - الوحدة 2","(2) المكونات الرئيسية لنظام الكشف على المضيف (Host-Based IDS) هي:",["مستشعرات الشبكة وأجهزة الراوتر.","أجهزة الحماية النشطة والمكونات البرمجية.","سجلات الأحداث ومراقبة النظام.","الأجهزة الحاسوبية والقدرات الشبكية القوية."],2],
  [94,"ch8","الفصل 8 - الوحدة 2","(3) وظيفة نظام الكشف على المضيف (Host-Based IDS) هي:",["رصد وتحليل حركة المرور على الشبكة.","تحليل سجلات الأحداث للكشف عن أنشطة غير مشروعة.","تحديد نقاط الضعف في نظام التشغيل والتطبيقات.","منع الهجمات الخارجية من الوصول إلى الشبكة."],1],
  [95,"ch8","الفصل 8 - الوحدة 3","(1) نظام الكشف عن التوقيعات Signature-based IDS هو:",["نظام يستند إلى تحليل السلوك للكشف عن الهجمات.","نظام يستخدم قواعد بيانات للتعرف على أنماط الهجمات المعروفة.","نظام يعتمد على تشفير الاتصالات لحماية الشبكة.","نظام يستخدم الذكاء الاصطناعي للكشف عن الهجمات."],1],
  [96,"ch8","الفصل 8 - الوحدة 3","(2) كيف يتعرف نظام الكشف عن التوقيعات على الهجمات؟",["من خلال مراقبة حركة المرور وتحليل الأنماط غير العادية.","من خلال تحديث قواعد التوقيعات تلقائياً من قواعد البيانات العالمية.","من خلال تحليل سجلات النشاط على الأجهزة المتصلة بالشبكة.","من خلال اكتشاف الثغرات الأمنية في البرمجيات المستخدمة."],0],
  [97,"ch8","الفصل 8 - الوحدة 3","(3) الخاصية الرئيسية لنظام الكشف عن التوقيعات هي:",["قدرته على اكتشاف الهجمات المستهدفة.","قدرته على التعامل مع الهجمات المتطورة.","قدرته على اكتشاف الهجمات الجديدة وغير المعروفة.","قدرته على تحليل سلوك المستخدمين والكشف عن النشاط غير العادي."],0],

  [98,"ch9","الفصل 9 - الوحدة 1","(1) وظيفة الطبقة الإدراكية في نموذج أمن إنترنت الأشياء هي:",["جمع البيانات من الأشياء المتصلة.","تحليل ومعالجة البيانات المجمعة.","تأمين الاتصال بين الأشياء المتصلة.","توفير واجهة المستخدم للتحكم بالأشياء المتصلة."],0],
  [99,"ch9","الفصل 9 - الوحدة 1","(2) التقنيات الأساسية المستخدمة في الطبقة الإدراكية هي:",["تقنيات الاتصال اللاسلكي.","تقنيات التشفير والتوقيع الرقمي.","تقنيات الاستشعار والتحليل البياني.","تقنيات إدارة الشبكات والخوادم."],2],
  [100,"ch9","الفصل 9 - الوحدة 1","(3) وظيفة الطبقة الشبكية في نموذج أمان إنترنت الأشياء هي:",["جمع البيانات من الحساسات.","توفير البيانات الموثوقة بين الشبكات.","تصنيف وتجميع البيانات المجمعة.","المعالجة الأولية للبيانات الحساسة."],1],
  [101,"ch9","الفصل 9 - الوحدة 2","(1) الفائدة الرئيسية لتحديثات البرامج والتصحيحات في إنترنت الأشياء هي:",["تحسين أداء الجهاز الأساسي.","زيادة سرعة الاتصال بالشبكة.","تصحيح الأمان وإصلاح الأخطاء.","إضافة ميزات جديدة للأجهزة."],2],
  [102,"ch9","الفصل 9 - الوحدة 2","(2) الإجراء الأساسي لحماية كلمة المرور في إنترنت الأشياء هي:",["استخدام كلمة مرور قوية وفريدة.","تغيير كلمة المرور بانتظام.","استخدام برنامج إدارة كلمات المرور.","تشفير كلمة المرور للأمان."],0],
  [103,"ch9","الفصل 9 - الوحدة 2","(3) الطريقة الفعالة لتقليل المخاطر المتعلقة بأمان WiFi في إنترنت الأشياء هي:",["تمكين WPS واستخدام كلمة مرور قوية.","تعطيل WPS واستخدام بروتوكول WPA2.","استخدام جهاز توجيه WiFi متقدم.","تغيير كلمة مرور WiFi بانتظام."],1],
  [104,"ch9","الفصل 9 - الوحدة 3","(1) التهديد الأمني الذي يحدث عندما يتم استغلال جهاز إنترنت الأشياء لتنفيذ هجمات على الأنظمة الأخرى:",["التجسس الإلكتروني.","اختراق الشبكة.","هجمات البوت نت (Bot Net).","سرقة الهوية."],2],
  [105,"ch9","الفصل 9 - الوحدة 3","(2) التهديد الأمني الذي يحدث عندما يتم الاستيلاء على بيانات شخصية متصلة بجهاز إنترنت الأشياء هو:",["التجسس الإلكتروني.","سرقة الهوية.","هجمات DDoS.","اختراق الشبكة."],1],

  [107,"ch10","الفصل 10 - الوحدة 1","(1) الهدف الرئيسي لاستخدام قوائم التحكم في الوصول هو:",["حماية الشبكة من الهجمات الخارجية.","تنظيم حركة المرور في الشبكة الداخلية.","تقديم الحماية القصوى للبيانات الحساسة.","تحسين أداء الشبكة."],1],

  [109,"ch10","الفصل 10 - الوحدة 1","(3) الأمر المستخدم لإنشاء وتطبيق قوائم التحكم في الوصول في أجهزة التوجيه (Routers) هو:",["access-list","ip access-object","ip access-list extended","access-class"],0],
  [110,"ch10","الفصل 10 - الوحدة 2","(1) التأثير الذي يحدث عند تطبيق قائمة الوصول القياسية على واجهة الشبكة هو:",["تمنع حركة المرور الواردة فقط.","تمنع حركة المرور الصادرة فقط.","تمنع حركة المرور في كلا الاتجاهين.","لا تؤثر على حركة المرور."],2],
  [111,"ch10","الفصل 10 - الوحدة 2","(2) النطاق الصحيح لقائمة الوصول القياسية هو:",["100-199","1-99","200-299","300-399"],1],
  [112,"ch10","الفصل 10 - الوحدة 2","(3) العملية المستخدمة لتطبيق قائمة الوصول القياسية هي:",["التطابق العكسي (Reverse Matching)","التطابق المباشر (Exact Matching)","التطابق المتعدد (Multiple Matching)","التطابق الجزئي (Partial Matching)"],1],
  [113,"ch10","الفصل 10 - الوحدة 3","(1) وظيفة قائمة التحكم في الوصول الموسعة (Extended Access-list) هي:",["تسمح بالتحكم في حركة البيانات داخل الشبكة الداخلية.","تحدد القواعد التي تسمح أو تمنع اتصالات الشبكة من وإلى مصادر محددة.","تنشئ الشبكات الفرعية وتعين عناوين IP للأجهزة المتصلة.","توفر واجهة برمجة التطبيقات API للتحكم في قواعد الأمان."],1],

  [119,"ch11","الفصل 11 - الوحدة 2","(1) واحدة من أكثر الدفاعات فعالية ضد تهديدات أمان الهواتف المحمولة هي:",["التشفير.","الشبكات الآمنة.","الوعي والتثقيف.","التحديث الدوري."],2],

  [121,"ch11","الفصل 11 - الوحدة 2","(3) واحدة من الطرق الموصى بها للحماية في حالة استخدام شبكات الواي فاي العامة هي:",["استخدام VPN.","تشفير البيانات.","تحميل التطبيقات من مصادر موثوقة.","تحديث الأجهزة بانتظام."],0],
  [122,"ch11","الفصل 11 - الوحدة 3","(1) الخطوة الأولى التي يجب اتخاذها لتعزيز أمان الاتصالات عبر الشبكة هي:",["تحديث الأجهزة المتصلة.","تشفير البيانات المرسلة.","تفعيل حماية الجهاز بكلمة مرور قوية.","تفعيل جدار الحماية."],1],
  [123,"ch11","الفصل 11 - الوحدة 3","(2) الوظيفة الرئيسية لجدار الحماية (Firewall) في شبكة الاتصال هي:",["تشفير الاتصالات.","حماية الجهاز بكلمة مرور قوية.","فصل الشبكة عن الاتصالات غير المصرح بها.","تقييد الوصول إلى الشبكة وتحديد التصاريح."],2],

const STORAGE_KEY = "kfu_data_sec_151_v1";
let state = {
  filter: "all",
  mistakesOnly: false,
  listMode: false,
  idx: 0,
  ans: {},
  mistakes: []
};

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) state = { ...state, ...JSON.parse(saved) };
} catch(e) {}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function getActiveList() {
  if (state.mistakesOnly) {
    return RAW_BANK.filter(item => state.mistakes.includes(item[0]));
  }
  if (state.filter === "all") return RAW_BANK;
  return RAW_BANK.filter(item => item[1] === state.filter);
}

function updateStats() {
  let right = 0, wrong = 0;
  Object.keys(state.ans).forEach(id => {
    const q = RAW_BANK.find(x => x[0] === Number(id));
    if (q) {
      if (state.ans[id] === q[5]) right++;
      else wrong++;
    }
  });

  const list = getActiveList();
  const pos = list.length ? Math.min(state.idx + 1, list.length) : 0;
  document.getElementById("statProg").textContent = state.listMode ? `${list.length} سؤال` : `${pos} / ${list.length}`;
  document.getElementById("statRight").textContent = `✅ ${right}`;
  document.getElementById("statWrong").textContent = `❌ ${wrong}`;
  document.getElementById("mistakesCount").textContent = state.mistakes.length;

  const mBtn = document.getElementById("mistakesBtn");
  mBtn.classList.toggle("active", state.mistakesOnly);
  document.getElementById("viewModeBtn").textContent = state.listMode ? "🎯 سؤال بسؤال" : "📋 عرض كقائمة";

  const answeredInList = list.filter(x => state.ans[x[0]] !== undefined).length;
  const pct = list.length ? Math.round((answeredInList / list.length) * 100) : 0;
  document.getElementById("progFill").style.width = pct + "%";
}

function buildQuestionCard(item, posIndex, totalLen, showNav) {
  const [id, sec, tag, qText, opts, corr] = item;
  const uAns = state.ans[id];
  const isDone = uAns !== undefined;
  const letters = ["أ", "ب", "ج", "د"];

  const optsHtml = opts.map((opt, oIdx) => {
    let cls = "opt-btn";
    let mark = "";
    if (isDone) {
      if (oIdx === corr) { cls += " correct"; mark = "✅"; }
      else if (oIdx === uAns) { cls += " wrong"; mark = "❌"; }
      else { cls += " dimmed"; }
    }
    return `
      <button class="${cls}" ${isDone ? "disabled" : ""} onclick="selectAns(${id}, ${oIdx})">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="opt-letter">${letters[oIdx]}</span>
          <span>${opt}</span>
        </div>
        <span>${mark}</span>
      </button>
    `;
  }).join("");

  let navHtml = "";
  if (showNav) {
    const jumpOpts = getActiveList().map((x, i) => {
      const a = state.ans[x[0]];
      const st = a === undefined ? "" : (a === x[5] ? "✓" : "✗");
      return `<option value="${i}" ${i === state.idx ? "selected" : ""}>سؤال ${i + 1} ${st}</option>`;
    }).join("");

    navHtml = `
      <div class="nav-bar">
        <button class="nav-btn prev" ${state.idx === 0 ? "disabled" : ""} onclick="stepQ(-1)">➡️ السابق</button>
        <select onchange="jumpQ(this.value)" style="max-width:130px;text-align:center">${jumpOpts}</select>
        <button class="nav-btn next" ${state.idx >= totalLen - 1 ? "disabled" : ""} onclick="stepQ(1)">التالي ⬅️</button>
      </div>
    `;
  }

  return `
    <div class="q-card" id="qcard-${id}">
      <div class="q-meta">
        <span class="q-tag">${tag}</span>
        <span class="q-num">سؤال ${posIndex + 1} من ${totalLen} (#${id})</span>
      </div>
      <div class="q-text">${qText}</div>
      <div class="opts-list">${optsHtml}</div>
      ${navHtml}
    </div>
  `;
}

function render() {
  updateStats();
  const main = document.getElementById("mainArea");
  const list = getActiveList();

  if (list.length === 0) {
    main.innerHTML = `
      <div class="q-card" style="text-align:center;padding:32px 16px">
        <h3 style="margin:0 0 10px">🎉 لا توجد لديكِ أي أخطاء مسجلة حالياً!</h3>
        <button class="nav-btn next" onclick="toggleMistakes()">العودة لجميع الأسئلة</button>
      </div>
    `;
    return;
  }

  if (state.idx >= list.length) state.idx = list.length - 1;
  if (state.idx < 0) state.idx = 0;

  if (state.listMode) {
    main.innerHTML = list.map((item, i) => buildQuestionCard(item, i, list.length, false)).join("");
  } else {
    main.innerHTML = buildQuestionCard(list[state.idx], state.idx, list.length, true);
  }
}

function selectAns(id, oIdx) {
  state.ans[id] = oIdx;
  const q = RAW_BANK.find(x => x[0] === id);
  if (q) {
    if (oIdx !== q[5]) {
      if (!state.mistakes.includes(id)) state.mistakes.push(id);
    } else if (state.mistakesOnly) {
      state.mistakes = state.mistakes.filter(m => m !== id);
    }
  }
  save();
  render();
}

function stepQ(dir) {
  const list = getActiveList();
  const next = state.idx + dir;
  if (next >= 0 && next < list.length) {
    state.idx = next;
    save();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function jumpQ(val) {
  state.idx = Number(val);
  save();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function changeFilter(val) {
  state.filter = val;
  state.mistakesOnly = false;
  state.idx = 0;
  save();
  render();
}

function toggleViewMode() {
  state.listMode = !state.listMode;
  save();
  render();
}

function toggleMistakes() {
  state.mistakesOnly = !state.mistakesOnly;
  state.idx = 0;
  if (state.mistakesOnly) {
    state.mistakes.forEach(id => { delete state.ans[id]; });
  }
  save();
  render();
}

function resetProgress() {
  state.ans = {};
  state.mistakes = [];
  state.idx = 0;
  state.mistakesOnly = false;
  save();
  render();
}

document.getElementById("sectionFilter").value = state.filter || "all";
render();
</script>
