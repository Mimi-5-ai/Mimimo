<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بنك أسئلة الذكاء الاصطناعي الشامل (147 سؤالاً)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-subtle: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text-main: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --accent: #3b82f6;
  --accent-dark: #1d4ed8;
  --accent-soft: #eff6ff;
  --correct: #059669;
  --correct-bg: #ecfdf5;
  --correct-border: #6ee7b7;
  --wrong: #e11d48;
  --wrong-bg: #fff1f2;
  --wrong-border: #fda4af;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background-color: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
}

.container {
  max-width: 860px;
  margin: 0 auto;
  width: 100%;
}

.header-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.app-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--text-main);
  margin: 0;
  letter-spacing: -0.2px;
}

.app-subtitle {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.stats-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.stat-pill {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 6px;
  background: var(--surface-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.stat-pill.correct {
  background: var(--correct-bg);
  color: var(--correct);
  border-color: var(--correct-border);
}

.stat-pill.wrong {
  background: var(--wrong-bg);
  color: var(--wrong);
  border-color: var(--wrong-border);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

select, .btn-tool {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background-color: var(--surface);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
}

select {
  flex: 1;
  min-width: 180px;
}

select:focus, .btn-tool:focus {
  outline: none;
  border-color: var(--accent);
}

.btn-tool:hover {
  background-color: var(--surface-subtle);
}

.btn-tool.active {
  background-color: var(--text-main);
  color: #ffffff;
  border-color: var(--text-main);
}

.btn-tool.mistakes-btn {
  color: var(--wrong);
  border-color: var(--wrong-border);
  background-color: var(--wrong-bg);
}

.btn-tool.mistakes-btn.active {
  background-color: var(--wrong);
  color: #ffffff;
  border-color: var(--wrong);
}

.progress-track {
  width: 100%;
  height: 4px;
  background: var(--surface-subtle);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 14px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.25s ease;
}

main {
  flex: 1;
  padding: 24px 16px 48px;
}

.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--surface-subtle);
}

.section-badge {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--accent-dark);
  background: var(--accent-soft);
  padding: 4px 10px;
  border-radius: 6px;
}

.question-counter {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-muted);
}

.question-title {
  font-size: 1.08rem;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 16px;
  line-height: 1.65;
}

/* Visual Diagrams for 8-Puzzle and Graphs */
.visual-box {
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 18px;
  text-align: center;
  direction: ltr;
}

.puzzle-row-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

.puzzle-board-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.puzzle-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  direction: rtl;
}

.puzzle-grid {
  display: grid;
  grid-template-columns: repeat(3, 36px);
  grid-template-rows: repeat(3, 36px);
  gap: 3px;
  background: #334155;
  padding: 4px;
  border-radius: 6px;
}

.puzzle-cell {
  background: #ffffff;
  color: #0f172a;
  font-weight: 800;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
}

.puzzle-cell.empty {
  background: #cbd5e1;
}

.options-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  width: 100%;
  text-align: right;
  padding: 13px 16px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: all 0.15s ease;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.option-btn:disabled {
  cursor: default;
}

.option-btn.correct {
  background: var(--correct-bg);
  border-color: var(--correct);
  color: #065f46;
}

.option-btn.wrong {
  background: var(--wrong-bg);
  border-color: var(--wrong);
  color: #9f1239;
}

.option-btn.dimmed {
  opacity: 0.65;
}

.opt-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.opt-char {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--surface-subtle);
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 800;
  flex-shrink: 0;
}

.option-btn.correct .opt-char {
  background: var(--correct);
  color: #ffffff;
}

.option-btn.wrong .opt-char {
  background: var(--wrong);
  color: #ffffff;
}

.opt-status {
  font-size: 0.82rem;
  font-weight: 800;
  flex-shrink: 0;
}

/* Explanation Panel */
.explanation-panel {
  margin-top: 18px;
  border-radius: 10px;
  padding: 18px;
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  font-size: 0.92rem;
}

.exp-header {
  font-weight: 800;
  font-size: 0.98rem;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.exp-header.is-correct {
  color: var(--correct);
}

.exp-header.is-wrong {
  color: var(--wrong);
}

.exp-main-reason {
  color: var(--text-main);
  margin-bottom: 14px;
  line-height: 1.75;
}

.exp-options-title {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.exp-options-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.exp-opt-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.88rem;
  line-height: 1.65;
}

.exp-opt-item.correct-item {
  border-right: 3px solid var(--correct);
}

.exp-opt-item.wrong-item {
  border-right: 3px solid var(--border-strong);
}

.exp-opt-name {
  font-weight: 800;
  color: var(--text-main);
}

.nav-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--surface-subtle);
}

.btn-nav {
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-main);
  font-family: inherit;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-nav.primary {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  flex: 1;
  max-width: 200px;
}

.btn-nav.primary:hover:not(:disabled) {
  background: var(--accent-dark);
}

.btn-nav:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.ltr-inline {
  direction: ltr;
  display: inline-block;
  font-family: monospace, sans-serif;
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-top">
      <div>
        <h1 class="app-title">بنك أسئلة الذكاء الاصطناعي الشامل</h1>
        <div class="app-subtitle">147 سؤالاً من الواجبات والفصول 1–14؛ يشمل أسئلة النسختين وأسئلة الفصل الثامن التي كانت في الملف السابق.</div>
      </div>
      <div class="stats-group">
        <span class="stat-pill" id="statProgress">1 / 147</span>
        <span class="stat-pill correct" id="statCorrect">صحيحة: 0</span>
        <span class="stat-pill wrong" id="statWrong">خاطئة: 0</span>
      </div>
    </div>

    <div class="toolbar">
      <select id="sectionSelect" onchange="setSection(this.value)">
        <option value="all">جميع الأسئلة (147 سؤالاً)</option>
        <option value="hw">أسئلة الواجبات الثلاثة (10 أسئلة)</option>
        <option value="ch1">الفصل 1: مقدمة في الذكاء الاصطناعي (9 أسئلة)</option>
        <option value="ch2">الفصل 2: المستحدثات التقنية في الذكاء الاصطناعي (9 أسئلة)</option>
        <option value="ch3">الفصل 3: وكلاء الذكاء الاصطناعي (9 أسئلة)</option>
        <option value="ch4">الفصل 4: حل المشكلات عن طريق البحث (9 أسئلة)</option>
        <option value="ch5">الفصل 5: هياكل البيانات والبحث بأولوية الاتساع (9 أسئلة)</option>
        <option value="ch6">الفصل 6: البحث بالعمق والأفضل وتسلق التل (9 أسئلة)</option>
        <option value="ch7">الفصل 7: خوارزمية البحث A* ولغز 8-Puzzle (9 أسئلة)</option>
        <option value="ch8">الفصل 8: جميع الوحدات المتاحة (10 أسئلة)</option>
      </select>

      <button class="btn-tool" id="modeToggleBtn" onclick="toggleDisplayMode()">عرض كقائمة</button>
      <button class="btn-tool mistakes-btn" id="mistakesToggleBtn" onclick="toggleMistakesMode()">مراجعة الأخطاء (<span id="mistakesCounter">0</span>)</button>
      <button class="btn-tool" onclick="resetAll()">إعادة الضبط</button>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>
</header>

<main class="container" id="mainContainer"></main>

<script>
// Helper to build 3x3 8-puzzle HTML grid
function makePuzzleGrid(cells, label) {
  const gridCells = cells.map(c => `<div class="puzzle-cell ${c === '' ? 'empty' : ''}">${c}</div>`).join('');
  return `
    <div class="puzzle-board-group">
      ${label ? `<div class="puzzle-label">${label}</div>` : ''}
      <div class="puzzle-grid">${gridCells}</div>
    </div>
  `;
}

// All 73 questions of Part 1 with varied answer positions and complete option-by-option explanations

      { t: "عدم اكتمال المعلومات", why: "خيار مستبعد؛ يعني نقص المعطيات المتوفرة عن الحالة." },
      { t: "الغموض", why: "خيار مستبعد؛ يعني عدم وضوح البيانات اللغوية." },
      { t: "تغير البيئة", why: "إجابة صحيحة؛ التغير المستمر في البيئات الديناميكية يجعل النماذج والبيانات السابقة غير دقيقة لاتخاذ قرارات جديدة." },
      { t: "التعقيد والتفاعل", why: "خيار مستبعد؛ يعني تداخل العوامل في الأنظمة المعقدة." }
    ],
    ans: 2,
    summary: "تغير البيئة هو السبب الذي يفقد البيانات أو النماذج السابقة دقتها عند اتخاذ قرارات جديدة."
  },
  {
    id: 66,
    sec: "hw",
    unit: "الواجب الثالث — السؤال 3",
    q: "3. توزيع وتبسيط العبارة <span class='math-dir'>¬(P ∧ ¬Q)</span> :",
    opts: [
      { t: "¬P ∨ Q", why: "إجابة صحيحة؛ بتوزيع النفي تصبح P منفية (¬P)، وتنقلب (∧) إلى (∨)، ويلغى نفي Q فتصبح (Q)." },
      { t: "¬P ∧ Q", why: "خيار مستبعد؛ لم يتم قلب علامة (∧) إلى (∨)." }
    ],
    ans: 0,
    summary: "حسب قانون دي مورغان: ¬(P ∧ ¬Q) تكافئ ¬P ∨ Q."
  },
  {
    id: 67,
    sec: "hw",
    unit: "الواجب الثالث — السؤال 4",
    q: "4. تربط بين قضيتين بحيث تكون النتيجة صحيحة فقط إذا كانت كلتاهما صحيحتين:",
    opts: [
      { t: "Negation , ¬", why: "خيار مستبعد؛ أداة النفي." },
      { t: "Implication , →", why: "خيار مستبعد؛ أداة الشرط." },
      { t: "Disjunction , ∨", why: "خيار مستبعد؛ أداة الفصل (أو)." },
      { t: "Conjunction , ∧", why: "إجابة صحيحة؛ أداة الاقتران (و / AND) التي تشترط صحة القضيتين معاً." }
    ],
    ans: 3,
    summary: "الاقتران (Conjunction , ∧) يكون صحيحاً في حالة واحدة فقط هي صحة كلتا القضيتين."
  }
];
const chapterEightExplanations = QUESTIONS_PART3.find(question => question.sec === "ch8u3" && question.id === 1);
const QUESTIONS_PART2_NORMALIZED = QUESTIONS_PART2.map(question => ({
  ...question,
  id: question.id + 73,
  sec: question.id <= 3 ? "ch8u1" : question.id <= 6 ? "ch8u2" : "ch8u3",
  ...(question.id === 7 && chapterEightExplanations ? {
    mainExp: chapterEightExplanations.summary,
    optExps: chapterEightExplanations.opts.map(option => option.why)
  } : {})
}));
const QUESTIONS_PART3_NORMALIZED = QUESTIONS_PART3.map(question => ({
  id: question.id + 80,
  sec: question.sec,
  tag: question.unit,
  q: question.q,
  opts: question.opts.map(option => option.t),
  ans: question.ans,
  mainExp: question.summary,
  optExps: question.opts.map(option => option.why)
}));
const ALL_QUESTIONS = [...QUESTIONS_PART1, ...QUESTIONS_PART2_NORMALIZED, ...QUESTIONS_PART3_NORMALIZED];

function addQuestionSectionOptions() {
  const selector = document.getElementById("sectionSelect");
  const sections = [...new Set(ALL_QUESTIONS.map(question => question.sec))]
    .filter(section => /^ch(?:8|9|10|11|12|13|14)u[1-3]$/.test(section));

  sections.forEach(section => {
    const questions = ALL_QUESTIONS.filter(question => question.sec === section);
    const sectionNames = {
      ch8u1: "الفصل 8 — الوحدة 1: الوكيل المنطقي",
      ch8u2: "الفصل 8 — الوحدة 2: تمثيل المعرفة"
    };
    const title = sectionNames[section] || questions.find(question => question.unit)?.unit || questions[0].tag;
    const option = document.createElement("option");
    option.value = section;
    option.textContent = `${title} (${questions.length} أسئلة)`;
    selector.append(option);
  });
}

const STORAGE_KEY_P1 = "kfu_ai_bank_part1_v1";
let state = {
  section: "all",
  listMode: false,
  mistakesMode: false,
  idx: 0,
  answers: {},
  mistakes: []
};

try {
  const saved = localStorage.getItem(STORAGE_KEY_P1);
  if (saved) state = { ...state, ...JSON.parse(saved) };
} catch (e) {}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY_P1, JSON.stringify(state)); } catch (e) {}
}

function getFilteredQuestions() {
  if (state.mistakesMode) {
    return ALL_QUESTIONS.filter(q => state.mistakes.includes(q.id));
  }
  if (state.section === "all") return ALL_QUESTIONS;
  if (state.section === "ch8") return ALL_QUESTIONS.filter(question => question.sec.startsWith("ch8"));
  return ALL_QUESTIONS.filter(q => q.sec === state.section);
}

function updateHeaderStats() {
  let corr = 0, wrg = 0;
  Object.keys(state.answers).forEach(id => {
    const q = ALL_QUESTIONS.find(x => x.id === Number(id));
    if (q) {
      if (state.answers[id] === q.ans) corr++;
      else wrg++;
    }
  });

  const activeList = getFilteredQuestions();
  const currentPos = activeList.length ? Math.min(state.idx + 1, activeList.length) : 0;

  document.getElementById("statProgress").textContent = state.listMode
    ? `العدد: ${activeList.length}`
    : `${currentPos} / ${activeList.length}`;
  document.getElementById("statCorrect").textContent = `صحيحة: ${corr}`;
  document.getElementById("statWrong").textContent = `خاطئة: ${wrg}`;
  document.getElementById("mistakesCounter").textContent = state.mistakes.length;

  document.getElementById("modeToggleBtn").classList.toggle("active", state.listMode);
  document.getElementById("modeToggleBtn").textContent = state.listMode ? "عرض سؤال بسؤال" : "عرض كقائمة";
  document.getElementById("mistakesToggleBtn").classList.toggle("active", state.mistakesMode);

  const answeredInList = activeList.filter(q => state.answers[q.id] !== undefined).length;
  const pct = activeList.length ? Math.round((answeredInList / activeList.length) * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

function renderCard(qObj, indexInList, totalLen, withNav) {
  const userChoice = state.answers[qObj.id];
  const isAnswered = userChoice !== undefined;
  const letters = ["أ", "ب", "ج", "د"];

  const optionsHtml = qObj.opts.map((optText, oIdx) => {
    let cls = "option-btn";
    let statusLabel = "";
    if (isAnswered) {
      if (oIdx === qObj.ans) {
        cls += " correct";
        statusLabel = "إجابة صحيحة";
      } else if (oIdx === userChoice) {
        cls += " wrong";
        statusLabel = "اختيارك";
      } else {
        cls += " dimmed";
      }
    }
    return `
      <button class="${cls}" ${isAnswered ? "disabled" : ""} onclick="chooseOption(${qObj.id}, ${oIdx})">
        <div class="opt-content">
          <span class="opt-char">${letters[oIdx]}</span>
          <span>${optText}</span>
        </div>
        <span class="opt-status">${statusLabel}</span>
      </button>
    `;
  }).join("");

  let explanationHtml = "";
  if (isAnswered) {
    const isCorrect = userChoice === qObj.ans;
    const optBreakdown = qObj.opts.map((optText, oIdx) => {
      const isRightOpt = oIdx === qObj.ans;
      const reason = (qObj.optExps && qObj.optExps[oIdx]) ? qObj.optExps[oIdx] : "";
      return `
        <div class="exp-opt-item ${isRightOpt ? 'correct-item' : 'wrong-item'}">
          <span class="exp-opt-name">الخيار (${letters[oIdx]}) ${optText}:</span>
          <div>${reason}</div>
        </div>
      `;
    }).join("");

    explanationHtml = `
      <div class="explanation-panel">
        <div class="exp-header ${isCorrect ? 'is-correct' : 'is-wrong'}">
          ${isCorrect ? 'إجابة صحيحة — تحليل الإجابة:' : 'إجابة غير صحيحة — تم حفظ السؤال في مراجعة الأخطاء:'}
        </div>
        <div class="exp-main-reason">${qObj.mainExp}</div>
        <div class="exp-options-title">تفصيل جميع الخيارات (لماذا اخترنا الإجابة ولماذا استبعدنا الباقي):</div>
        <div class="exp-options-list">${optBreakdown}</div>
      </div>
    `;
  }

  let navHtml = "";
  if (withNav) {
    const activeList = getFilteredQuestions();
    const jumpOpts = activeList.map((item, i) => {
      const a = state.answers[item.id];
      const mark = a === undefined ? "" : (a === item.ans ? " (صح)" : " (خطأ)");
      return `<option value="${i}" ${i === state.idx ? "selected" : ""}>سؤال ${i + 1}${mark}</option>`;
    }).join("");

    navHtml = `
      <div class="nav-footer">
        <button class="btn-nav" ${state.idx === 0 ? "disabled" : ""} onclick="moveStep(-1)">السابق</button>
        <select onchange="jumpTo(this.value)" style="max-width:150px;text-align:center">${jumpOpts}</select>
        <button class="btn-nav primary" ${state.idx >= totalLen - 1 ? "disabled" : ""} onclick="moveStep(1)">التالي</button>
      </div>
    `;
  }

  return `
    <div class="question-card" id="q-${qObj.id}">
      <div class="card-header">
        <span class="section-badge">${qObj.tag}</span>
        <span class="question-counter">سؤال ${indexInList + 1} من ${totalLen}</span>
      </div>
      <div class="question-title">${qObj.q}</div>
      ${qObj.visual ? qObj.visual : ''}
      <div class="options-container">${optionsHtml}</div>
      ${explanationHtml}
      ${navHtml}
    </div>
  `;
}

function renderApp() {
  updateHeaderStats();
  const main = document.getElementById("mainContainer");
  const list = getFilteredQuestions();

  if (list.length === 0) {
    main.innerHTML = `
      <div class="question-card" style="text-align:center;padding:40px 20px">
        <div style="font-size:1.1rem;font-weight:800;margin-bottom:8px">لا توجد أخطاء مسجلة في هذا القسم حالياً</div>
        <div style="color:var(--text-muted);font-size:0.9rem;margin-bottom:18px">يمكنك العودة لاستعراض جميع الأسئلة أو اختيار فصل آخر.</div>
        <button class="btn-nav primary" onclick="toggleMistakesMode()">العودة لجميع الأسئلة</button>
      </div>
    `;
    return;
  }

  if (state.idx >= list.length) state.idx = list.length - 1;
  if (state.idx < 0) state.idx = 0;

  if (state.listMode) {
    main.innerHTML = list.map((q, i) => renderCard(q, i, list.length, false)).join("");
  } else {
    main.innerHTML = renderCard(list[state.idx], state.idx, list.length, true);
  }
}

function chooseOption(qId, optIdx) {
  state.answers[qId] = optIdx;
  const qObj = ALL_QUESTIONS.find(x => x.id === qId);
  if (qObj) {
    if (optIdx !== qObj.ans) {
      if (!state.mistakes.includes(qId)) state.mistakes.push(qId);
    } else if (state.mistakesMode) {
      state.mistakes = state.mistakes.filter(id => id !== qId);
    }
  }
  saveState();
  renderApp();
}

function moveStep(delta) {
  const list = getFilteredQuestions();
  const target = state.idx + delta;
  if (target >= 0 && target < list.length) {
    state.idx = target;
    saveState();
    renderApp();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function jumpTo(val) {
  state.idx = Number(val);
  saveState();
  renderApp();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function setSection(secVal) {
  state.section = secVal;
  state.mistakesMode = false;
  state.idx = 0;
  saveState();
  renderApp();
}

function toggleDisplayMode() {
  state.listMode = !state.listMode;
  saveState();
  renderApp();
}

function toggleMistakesMode() {
  state.mistakesMode = !state.mistakesMode;
  state.idx = 0;
  if (state.mistakesMode) {
    state.mistakes.forEach(id => { delete state.answers[id]; });
  }
  
  saveState();
  renderApp();
}

function resetAll() {
  if (confirm("هل ترغبين في مسح الإجابات المحفوظة والبدء من جديد؟")) {
    state.answers = {};
    state.mistakes = [];
    state.idx = 0;
    state.mistakesMode = false;
    saveState();
    renderApp();
  }
}

addQuestionSectionOptions();
document.getElementById("sectionSelect").value = state.section || "all";
renderApp();
</script>
</body>
</html>
