let currentMode = 'all';
let activeQuestions = [];
let userAnswers = {};

function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function prepareQuestions() {
    const chFilter = document.getElementById('chapterFilter').value;
    let pool = questionsData.map(q => {
        if (!q._shuffledOptions) {
            const indexed = q.options.map((text, idx) => ({ text, isCorrect: idx === q.ans }));
            const shuffled = shuffleArray(indexed);
            q._shuffledOptions = shuffled.map(o => o.text);
            q._correctIdx = shuffled.findIndex(o => o.isCorrect);
        }
        return q;
    });

    if (chFilter !== 'all') {
        pool = pool.filter(q => String(q.ch) === String(chFilter));
    }

    if (currentMode === 'problems') {
        pool = pool.filter(q => q.type === 'مسائل وتتبع' || q.type === 'تقييم ذاتي');
    } else if (currentMode === 'wrong') {
        pool = pool.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== q._correctIdx);
    } else if (currentMode === 'exam50') {
        pool = shuffleArray(pool).slice(0, 50);
    }

    activeQuestions = pool;
    renderQuiz();
    updateStats();
}

function setMode(mode, btnEl) {
    currentMode = mode;
    document.querySelectorAll('.mode-buttons .btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    prepareQuestions();
}

function applyFilters() {
    prepareQuestions();
}

function shuffleCurrentQuestions() {
    questionsData.forEach(q => { delete q._shuffledOptions; });
    userAnswers = {};
    activeQuestions = shuffleArray(questionsData);
    prepareQuestions();
}

function selectOption(qId, optIdx) {
    if (userAnswers[qId] !== undefined) return;
    userAnswers[qId] = optIdx;
    renderQuiz();
    updateStats();
}

function renderQuiz() {
    const container = document.getElementById('quizContainer');
    if (activeQuestions.length === 0) {
        container.innerHTML = `<div class="q-card" style="text-align:center;padding:40px;">لا توجد أسئلة مطابقة لهذا الفلتر حالياً.</div>`;
        return;
    }
    const letters = ['أ', 'ب', 'ج', 'د'];
    container.innerHTML = activeQuestions.map((q, index) => {
        const answered = userAnswers[q.id] !== undefined;
        const userChoice = userAnswers[q.id];
        const optionsHtml = q._shuffledOptions.map((optText, i) => {
            let cls = 'option-btn';
            if (answered) {
                if (i === q._correctIdx) cls += ' correct';
                else if (i === userChoice) cls += ' wrong';
            }
            return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="selectOption(${q.id}, ${i})">
                <strong>(${letters[i]})</strong> <span>${optText}</span>
            </button>`;
        }).join('');

        return `<div class="q-card">
            <div class="q-header">
                <span class="badge badge-ch">الفصل ${q.ch} | سؤال #${index + 1}</span>
                <span class="badge badge-type">${q.type}</span>
            </div>
            <div class="q-title">${q.q}</div>
            <div class="options-list">${optionsHtml}</div>
            <div class="exp-box ${answered ? 'show' : ''}">
                <strong>التعليل والشرح:</strong> ${q.exp}
            </div>
        </div>`;
    }).join('');
}

function updateStats() {
    const total = activeQuestions.length;
    let answered = 0, correct = 0, wrong = 0;
    activeQuestions.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
            answered++;
            if (userAnswers[q.id] === q._correctIdx) correct++;
            else wrong++;
        }
    });
    const percent = answered > 0 ? Math.round((correct / answered) * 100) : 0;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statAnswered').textContent = answered;
    document.getElementById('statCorrect').textContent = correct;
    document.getElementById('statWrong').textContent = wrong;
    document.getElementById('statPercent').textContent = percent + '%';
    document.getElementById('progressBar').style.width = (total > 0 ? (answered / total) * 100 : 0) + '%';
}

window.onload = () => {
    prepareQuestions();
};
</script>
